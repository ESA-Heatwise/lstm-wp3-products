name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create as pre-release'
        required: false
        type: boolean
        default: false
      version:
        description: Version name
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: "Compute the version"
        id: compute
        run: |
          set -euxo pipefail
          # cut off leading v and trailing newline from version number. I.e. tag "v0.0.2" turns into "0.0.2"
          RELEASE_VERSION=$(echo "$REF_NAME" | sed 's/v//' | tr -d '\n')

          # If the version number doesn't come from a tag, but a workflow dispatch, use the supplied version instead.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
            echo "error: invalid version '$RELEASE_VERSION'" >&2
            exit 1
          fi
          echo "release version: $RELEASE_VERSION"
          echo "tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
        env: 
          REF_NAME: ${{ github.ref_name}}
          INPUT_VERSION: ${{ inputs.version }}

  build-and-publish-images:
    needs: docker-tag
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.docker-tag.outputs.tag }}

  generate-versioned-cwls:
    runs-on: ubuntu-latest
    needs: docker-tag
    strategy:
      matrix:
         app:
           - hotspots
           - inertia
           - ua
    env:
      ARTIFACT_DIR: "dist"
      RELEASE_VERSION: ${{ needs.docker-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set input / output CWL path
        run: |
          set -euxo pipefail
          echo "INPUT_CWL=products/${{ matrix.app }}/app/eoap.cwl" >> "$GITHUB_ENV"
          mkdir -p dist
          echo "OUTPUT_CWL=${{ env.ARTIFACT_DIR }}/heatwise-${{ matrix.app }}.cwl" >> "$GITHUB_ENV"

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}"

      - name: Info
        run: |
          echo "version: $RELEASE_VERSION"
          echo "INPUT: ${{ env.INPUT_CWL }}"
          echo "OUTPUT: ${{ env.OUTPUT_CWL }}"
          echo "IMAGE_NAME: ${{ env.IMAGE_NAME }}"

      - name: Replace version in CWL with release version
        run: |
          if [[ $(grep -c "dockerPull" ${{ env.INPUT_CWL }}) -gt 2 ]]; then
            echo "Expect up to two dockerPull entries" >&2
            exit 1
          fi

          # version and softwareVersion are set to the same version as the tag.
          sed \
            -e "s#dockerPull: [^ ]*#dockerPull: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app }}:$RELEASE_VERSION#"\
            -e "s#^s:softwareVersion: .*#s:softwareVersion: $RELEASE_VERSION#" \
            -e "s#^s:version: .*#s:version: $RELEASE_VERSION#" \
               "${{ env.INPUT_CWL }}" > "${{ env.OUTPUT_CWL}}"

      - name: Check that at most 4 lines were changed
        run: |
          changed=$(diff "${{ env.INPUT_CWL }}" "${{ env.OUTPUT_CWL }}" | grep -c '^>' || true)
          # If expecting to change multiple lines, adapt the number
          if [[ $changed -gt 4 ]]; then
            echo "error: expected max 4 changed lines in ${{ env.INPUT_CWL }}, got $changed" >&2
            exit 1
          fi


      - name: Include READMEs in dist
        run: |
          cp products/${{ matrix.app }}/README.md ${{ env.ARTIFACT_DIR }}/README-${{ matrix.app }}.md


      - name: Upload release CWLs
        uses: actions/upload-artifact@v4
        with:
          name: cwl-release-${{ matrix.app }}
          path: ${{ env.ARTIFACT_DIR }}/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [docker-tag, build-and-publish-images, generate-versioned-cwls]
    permissions:
      contents: write
    env:
      ARTIFACT_DIR: dist
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: cwl-release-*
          path: ${{ env.ARTIFACT_DIR }}
          merge-multiple: true
      - run: |
          ls -l dist
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            README.md
            LICENSE
          prerelease: ${{ inputs.prerelease || false }}
          tag_name: v${{ needs.docker-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}

